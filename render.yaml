services:
  - type: web
    name: ai-mystery-room-api
    env: node
    plan: free
    buildCommand: "npm install && npm run build:client && cd server && npm install"
    startCommand: "cd server && npm start"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
